<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Усан доорх ертөнц 🌊</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
  min-height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  position: relative;

  /* Зургийг дэлгэцэнд 100% тааруулах */
  background: 
    linear-gradient(rgba(3, 20, 40, 0.35), rgba(3, 20, 40, 0.45)),
    url('https://images.unsplash.com/photo-1498623116890-37e912163d5d?auto=format&fit=crop&w=1920&q=80](https://images.unsplash.com/photo-1498623116890-37e912163d5d?auto=format&fit=crop&w=1920&q=80') no-repeat center center;
  background-size: 100% 100%; /* Өргөн, өндрийг дэлгэцэнд бүтнээр нь шахна */
}
    

    /* Усан дотор нарны цацраг тусах мэт долгион */
    .sun-shafts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        75deg,
        transparent,
        transparent 60px,
        rgba(56, 189, 248, 0.04) 60px,
        rgba(56, 189, 248, 0.04) 120px
      );
      pointer-events: none;
      animation: causticWave 8s ease-in-out infinite alternate;
    }

    @keyframes causticWave {
      0% { opacity: 0.3; transform: scaleX(1); }
      100% { opacity: 0.7; transform: scaleX(1.08); }
    }

    /* Хөвөх бөмбөлөгүүд */
    .bubble {
      position: absolute;
      bottom: -40px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      box-shadow: inset 0 0 8px rgba(186, 230, 253, 0.6);
      pointer-events: none;
      animation: bubbleFloat linear infinite;
    }

    @keyframes bubbleFloat {
      0% { transform: translateY(0) scale(1); opacity: 0.8; }
      100% { transform: translateY(-115vh) scale(1.4); opacity: 0; }
    }

    /* Далайн шилэн карт */
    .card {
      position: relative;
      background: rgba(14, 42, 71, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      border-radius: 30px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 430px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), inset 0 0 25px rgba(56, 189, 248, 0.15);
      z-index: 10;
    }

    h1 {
      font-size: 1.55rem;
      color: #e0f2fe;
      margin-bottom: 2rem;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
      line-height: 1.4;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 55px;
    }

    /* Үгүй товч */
    .btn-no {
      padding: 0.9rem 2.2rem;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      background: rgba(15, 45, 80, 0.6);
      color: #bae6fd;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.2);
      transition: all 0.3s ease;
    }

    /* Үгүй дээр хулгана очиход оюу ногоон болж гэрэлтэнэ */
    .btn-no:hover {
      background: rgba(2, 132, 199, 0.85);
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
      transform: scale(1.04);
    }

    /* Загас мэт Тийм товч */
    .btn-fish {
      position: fixed;
      padding: 0.85rem 2rem;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid rgba(186, 230, 253, 0.8);
      color: #ffffff;
      z-index: 999;
      pointer-events: auto;
      will-change: transform, background, box-shadow;
      backdrop-filter: blur(6px);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);

      /* Тайван үеийн цэнхэр өнгө */
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.45), inset 0 0 12px rgba(255, 255, 255, 0.5);
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }

    /* Ойртох эсвэл хүрэх үед хувирах өнгө (Гэрэлтдэг нил ягаан/шүрэн) */
    .btn-fish.danger {
      background: linear-gradient(135deg, #ec4899, #8b5cf6) !important;
      box-shadow: 0 0 30px rgba(236, 72, 153, 0.75), inset 0 0 15px rgba(255, 255, 255, 0.7) !important;
      border-color: #fbcfe8 !important;
    }

    .bye-title {
      font-size: 2.2rem;
      color: #e0f2fe;
      font-weight: 800;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
    }

    .bye-sub {
      color: #7dd3fc;
      font-size: 1rem;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="sun-shafts"></div>

  <!-- Усан доорх бөмбөлөгүүд -->
  <div class="bubble" style="left: 10%; width: 14px; height: 14px; animation-duration: 9s;"></div>
  <div class="bubble" style="left: 28%; width: 22px; height: 22px; animation-duration: 12s; animation-delay: 2s;"></div>
  <div class="bubble" style="left: 55%; width: 12px; height: 12px; animation-duration: 7s; animation-delay: 1s;"></div>
  <div class="bubble" style="left: 78%; width: 26px; height: 26px; animation-duration: 10s; animation-delay: 3s;"></div>
  <div class="bubble" style="left: 92%; width: 18px; height: 18px; animation-duration: 8s; animation-delay: 4s;"></div>

  <div class="card">
    <div id="screen-question">
      <h1>Та намайг сонирхож байна уу? 🌊</h1>
      <div class="btn-container">
        <button class="btn-no" onclick="handleNo()">Үгүй</button>
      </div>
    </div>

    <!-- Үгүй дээр дарахад гарах дэлгэц -->
    <div id="screen-bye" class="hidden">
      <div class="bye-title">Bye 🌊</div>
      <p class="bye-sub">Далайн гүнд дараа уулзъя!</p>
    </div>
  </div>

  <!-- Хөвөх Тийм товч -->
  <button id="fishBtn" class="btn-fish">Тийм 🫧</button>

  <script>
    const fish = document.getElementById('fishBtn');

    let posX = window.innerWidth / 2 - 130;
    let posY = window.innerHeight / 2 + 35;
    let vx = 0;
    let vy = 0;
    let mouseX = -9999;
    let mouseY = -9999;
    let time = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      }
    }, { passive: true });

    function animate() {
      time += 0.03;

      // Зөөлөн урсах хөдөлгөөн
      vx += Math.sin(time * 0.8) * 0.12;
      vy += Math.cos(time * 0.6) * 0.12;

      const rect = fish.getBoundingClientRect();
      const fishCenterX = posX + rect.width / 2;
      const fishCenterY = posY + rect.height / 2;

      const dx = fishCenterX - mouseX;
      const dy = fishCenterY - mouseY;
      const distance = Math.hypot(dx, dy);
      const escapeZone = 170;

      // Ойртох үед өнгө хувирах ба зугтах
      if (distance < escapeZone && distance > 0) {
        fish.classList.add('danger');

        const force = (escapeZone - distance) / escapeZone;
        const pushPower = 2.4;
        vx += (dx / distance) * force * pushPower;
        vy += (dy / distance) * force * pushPower;
      } else {
        fish.classList.remove('danger');
      }

      // Усны үрэлт
      vx *= 0.94;
      vy *= 0.94;

      posX += vx;
      posY += vy;

      // Хана мөргөхөөс сэргийлэх
      const padding = 20;
      const maxX = window.innerWidth - rect.width - padding;
      const maxY = window.innerHeight - rect.height - padding;

      if (posX < padding) { posX = padding; vx = Math.abs(vx) * 0.6; }
      if (posX > maxX) { posX = maxX; vx = -Math.abs(vx) * 0.6; }
      if (posY < padding) { posY = padding; vy = Math.abs(vy) * 0.6; }
      if (posY > maxY) { posY = maxY; vy = -Math.abs(vy) * 0.6; }

      // Загасны сүүлний шарвалт
      const speed = Math.hypot(vx, vy);
      const wiggle = Math.sin(time * 7) * Math.min(speed * 4, 12);

      fish.style.left = `${posX}px`;
      fish.style.top = `${posY}px`;
      fish.style.transform = `rotate(${wiggle}deg)`;

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    fish.addEventListener('click', (e) => {
      e.preventDefault();
      vx += (Math.random() - 0.5) * 16;
      vy += (Math.random() - 0.5) * 16;
    });

    function handleNo() {
      document.getElementById('screen-question').classList.add('hidden');
      document.getElementById('screen-bye').classList.remove('hidden');
      fish.style.display = 'none';
    }
  </script>
</body>
</html>
